name: travelmate
description: Flutter travel agency platform with AI-powered features and comprehensive booking system.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # HTTP & API
  dio: ^5.4.2+1
  json_annotation: ^4.8.1

  # UI & Utilities
  cached_network_image: ^3.3.1

  # Data Storage
  shared_preferences: ^2.2.3

  # Environment & Configuration
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  test: ^1.25.2
  fake_async: ^1.3.1

  # Code Generation
  build_runner: ^2.4.9
  json_serializable: ^6.7.1

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true